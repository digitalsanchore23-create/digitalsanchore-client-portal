<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Sanchore | Request Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3EF;
    --ink:#181614;
    --muted:#6E6A64;
    --accent:#D9481D;
    --whatsapp:#25D366;
    --card:#FFFFFF;
    --line:#E1DDD3;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ink);font-family:'Hind',sans-serif;line-height:1.6;
  }
  h1,h2,h3{font-family:'Baloo 2','Hind',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:36px 20px 60px;position:relative;}

  /* Language switcher button - fixed to corner */
  .lang-switch{
    position:fixed;top:14px;right:14px;z-index:50;
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 6px;display:flex;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .lang-switch button{
    border:none;background:transparent;color:var(--muted);font-family:'Hind',sans-serif;
    font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:999px;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .lang-switch button.active{background:var(--accent);color:#fff;}
  .lang-switch button:hover:not(.active){background:var(--bg);}

  /* Brand logo - centered where the brand-name text used to be */
  .wrap{padding-top:54px;}
  .brand{text-align:center;margin-bottom:10px;line-height:0;}
  .brand-logo{display:block;margin:0 auto;width:min(300px,84%);height:auto;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  @media (max-width:400px){ .wrap{padding-top:46px;} }
  .tagline{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:18px;}
  .promo-line{
    text-align:center;font-family:'Baloo 2','Hind',sans-serif;font-weight:700;
    font-size:22px;line-height:1.4;color:var(--accent);margin-bottom:10px;
  }
  .promo-sub{text-align:center;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:28px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px;margin-bottom:18px;}
  .card h2{font-size:17px;margin-bottom:14px;}

  .price-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .price-row:last-child{border-bottom:none;}
  .price-row .name{font-weight:600;font-size:15px;}
  .price-row .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .price-row .amount{font-family:'Baloo 2',sans-serif;font-weight:700;color:var(--accent);font-size:19px;white-space:nowrap;}

  .list li{font-size:14.5px;color:var(--muted);margin-bottom:9px;padding-left:18px;position:relative;}
  .list li::before{content:"•";color:var(--accent);position:absolute;left:0;font-weight:700;}

  .contact-line{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px;}
  .contact-line a{color:var(--ink);font-weight:600;}
  .contact-line a:hover{color:var(--accent);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input,.field select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;color:var(--ink);font-family:'Hind',sans-serif;font-size:15px;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}

  .btn-send{
    width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
    background:var(--whatsapp);color:#fff;
    min-height:60px;padding:16px 18px;border-radius:14px;border:none;cursor:pointer;
    font-family:'Hind',sans-serif;font-weight:700;font-size:18px;letter-spacing:.2px;
    box-shadow:0 6px 16px rgba(37,211,102,0.38);
    transition:transform .12s, box-shadow .12s, filter .12s;
  }
  .btn-send svg{width:30px;height:30px;flex:none;fill:#fff;}
  .btn-send:hover{filter:brightness(1.05);}
  .btn-send:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(37,211,102,0.35);}

  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:20px;}

  /* Highlight / popup-style card */
  .highlight-card{
    position:relative;
    background:linear-gradient(150deg,#FFF3EC 0%,#FFFFFF 65%);
    border:2px solid var(--accent);
    border-radius:18px;
    padding:26px 22px 22px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(217,72,29,0.14);
    overflow:hidden;
  }
  .highlight-card::before{
    content:"";
    position:absolute;top:-40px;right:-40px;width:120px;height:120px;
    background:radial-gradient(circle,rgba(217,72,29,0.18) 0%,rgba(217,72,29,0) 70%);
  }
  .highlight-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent);color:#fff;font-weight:700;font-size:11.5px;
    padding:5px 12px;border-radius:999px;margin-bottom:12px;
    letter-spacing:.3px;
  }
  .highlight-card h2{
    font-size:18.5px;color:var(--accent);margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .highlight-card p{
    font-size:14.5px;color:var(--ink);position:relative;z-index:1;
  }

  @media (max-width:400px){
    .lang-switch{top:8px;right:8px;padding:4px 4px;}
    .lang-switch button{padding:5px 8px;font-size:11.5px;}
  }
</style>
</head>
<body>

<div class="lang-switch" id="langSwitch">
  <button type="button" data-lang="hi">हिं</button>
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="gu">ગુ</button>
</div>

let currentLang = "hi";

function applyLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  const t = translations[lang];

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key] !== undefined) el.textContent = t[key];
  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    if(t[key] !== undefined) el.setAttribute('placeholder', t[key]);
  });

  document.querySelectorAll('#langSwitch button').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });
}

document.getElementById('langSwitch').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  applyLanguage(btn.getAttribute('data-lang'));
});

applyLanguage('hi');
